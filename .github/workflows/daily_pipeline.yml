name: Daily MLB Target Intelligence Pipeline

on:
  schedule:
    - cron: '0 14 * * *'  # 10:00 AM EDT Daily
  workflow_dispatch:

jobs:
  run-mlb-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Settle Mode (Yesterday's Board)
        run: |
          python run_models.py --target all --mode settle

      - name: Run Predict Mode & Dispatch Email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python run_models.py --target all --mode predict

      - name: Upload Generated Target Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-target-cards
          path: exports/
