name: Daily Pipeline

on:
  schedule:
    # Runs at 10am, 12pm, 2pm, 4pm, 6pm, and 8pm EDT during baseball season
    # (14:00, 16:00, 18:00, 20:00, 22:00, and 00:00 UTC)
    - cron: '0 14,16,18,20,22,0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Settle Past Games (Historical Grading)
        run: |
          python run_models.py --mode settle

      - name: Generate Today's Predictions
        run: |
          python run_models.py --mode predict

      - name: Commit and Push All Updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add exports/
          git commit -m "Automated bi-hourly settlement & projection update" || echo "No changes to commit"
          git pull origin main --rebase
          git push origin main
