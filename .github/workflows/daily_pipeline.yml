name: MLB HR Model - Multi-Stage Daily Pipeline

on:
  schedule:
    # 1. Early Slate Sweep: 11:30 AM EDT (15:30 UTC)
    - cron: '30 15 * * *'
    # 2. Main Slate Sweep: 4:30 PM EDT (20:30 UTC)
    - cron: '30 20 * * *'
    # 3. Lock Sweep: 6:15 PM EDT (22:15 UTC)
    - cron: '15 22 * * *'
    # 4. Overnight Automated Settlement: 3:00 AM EDT (07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'predict'
        type: choice
        options:
          - predict
          - settle

jobs:
  run-mlb-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute HR Pipeline
        if: github.event_name == 'workflow_dispatch' || github.event.schedule != '0 7 * * *'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python run_daily.py --mode predict

      - name: Execute Settlement
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'settle' || github.event.schedule == '0 7 * * *'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python run_daily.py --mode settle

      - name: Upload Daily Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-hr-output-${{ github.run_id }}
          path: exports/
          retention-days: 7
