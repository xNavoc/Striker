name: NFL Pipeline Daily Automation

on:
  schedule:
    # Runs daily at 06:00 UTC (2:00 AM EDT) for general updates
    - cron: '0 6 * * *'
    # Runs Sunday at 15:30 UTC (11:30 AM EDT) for 90-minute inactive scratches
    - cron: '30 15 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java for PySpark
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline & Update Accuracy Ledger
        run: |
          python main.py

      - name: Commit and Push Updated Parquet Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.parquet
          git commit -m "chore(data): automated daily projection and accuracy update [skip ci]" || echo "No data changes to commit"
          git push origin main
