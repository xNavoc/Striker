name: Overnight Settlement Engine

on:
  schedule:
    # Runs daily at 3:00 AM EDT (07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  settle-past-slates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Settlement Engine
        run: |
          mkdir -p exports/settlement
          python run_models.py --mode settle

      - name: Commit and Push Graded Ledgers
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A exports/settlement/ || true
          git commit -m "Overnight settlement complete: graded past slates" || echo "No changes to commit"
          git pull origin main --rebase
          git push origin main
